<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貼圖下載｜影音與影像設計整合應用</title>
<meta name="description" content="貼上 LINE 貼圖網址，一鍵取回整組貼圖圖片，並打包成 ZIP 下載。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gallery.css">
<style>
.form{display:grid;gap:14px;max-width:760px}
.form label{font-weight:700;font-size:1.1rem}
textarea{width:100%;min-height:132px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-size:1.05rem;line-height:1.6;resize:vertical}
textarea:focus{outline:none;border-color:var(--green-ink)}
.hint{color:var(--mut);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btn{min-height:56px;padding:0 28px;border:0;border-radius:99px;background:var(--green);color:#04210f;font:inherit;font-size:1.1rem;font-weight:900;cursor:pointer}
.btn.dark{background:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.check input:focus-visible{outline:3px solid var(--green-ink);outline-offset:3px}
.check{display:flex;align-items:center;gap:10px;font-size:1rem;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--green-ink)}
.status{min-height:1.7em;font-weight:700;color:var(--green-ink)}
.status.err{color:#b3261e}
.bar{position:sticky;top:64px;z-index:5;display:none;margin:28px 0 8px;padding:14px 18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(31,42,36,.06)}
.bar.on{display:flex}
.bar .row{width:100%;justify-content:space-between}
progress{width:100%;height:10px;margin-top:10px;accent-color:var(--green)}
.pack{margin:30px 0 8px;padding:22px;border-radius:24px;background:var(--tint,var(--t1))}
.pack-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:16px}
.pack-head img{width:84px;height:84px;object-fit:contain;flex:none}
.pack-head h2{font-size:1.5rem;font-weight:900;line-height:1.3}
.meta{color:var(--mut);font-size:.95rem}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--ink);color:#fff;font-size:.85rem;font-weight:700;margin-right:6px}
.pack-head a{margin-left:auto;color:var(--green-ink);font-weight:700}
.note{margin:-6px 0 14px;color:var(--mut);font-size:.9rem}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.stickers a{display:block;padding:8px;border-radius:14px;background:rgba(255,255,255,.7)}
.stickers a:hover{background:#fff}
.stickers a:focus-visible{outline:3px solid var(--green-ink);outline-offset:2px}
.stickers img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.stickers span{display:block;text-align:center;color:var(--mut);font-size:.8rem}
.empty{padding:40px 0 80px;color:var(--mut)}
@media(max-width:760px){
  .bar{top:96px}
  .bar .row{flex-direction:column;align-items:stretch}
  .btn{width:100%}
  .pack{padding:16px}
  .pack-head a{margin-left:0}
  .stickers{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stickers a{padding:4px}
}
</style>
</head>
<body>
<nav class="topbar" aria-label="網站選單">
  <div class="wrap">
    <a class="brand" href="index.html">影音與影像設計整合應用</a>
    <div class="tabs">
      <a href="index.html">靜態貼圖</a>
      <a href="animated.html">動態貼圖</a>
      <a href="stickers.html">全螢幕貼圖</a>
    </div>
  </div>
</nav>
<div class="wrap">
  <header>
    <div class="course">LINE 貼圖小工具</div>
    <h1>貼圖下載</h1>
    <p class="lead">貼上 LINE 貼圖的網址，按「取得貼圖」就能看到整組圖片，再一鍵打包成 ZIP 下載。</p>
  </header>

  <form class="form" id="form">
    <label for="urls">LINE 貼圖網址</label>
    <textarea id="urls" placeholder="https://line.me/S/sticker/37177919" spellcheck="false"></textarea>
    <p class="hint">可以一次貼好幾組，一行一個。商店網址（store.line.me）或只輸入貼圖編號也可以。</p>
    <div class="row">
      <button class="btn" id="go" type="submit">取得貼圖</button>
      <label class="check"><input type="checkbox" id="withStill"> 動態、全螢幕貼圖也附上靜態圖</label>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <div class="bar" id="bar">
    <div style="width:100%">
      <div class="row">
        <span id="summary"></span>
        <button class="btn dark" id="zip" type="button">下載 ZIP</button>
      </div>
      <progress id="prog" value="0" max="1" hidden></progress>
    </div>
  </div>

  <main id="out"><p class="empty">還沒有貼圖，請先在上方貼上網址。</p></main>
</div>
<footer><div class="wrap">圖片與版權屬各創作者所有，由 LINE 提供；請只下載自己的作品，或作為課程學習使用。</div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// 全部在瀏覽器裡完成：LINE 的圖片伺服器允許跨站讀取，productInfo.meta 會列出貼圖名稱、類型與每張貼圖編號
const CDN = 'https://stickershop.line-scdn.net/stickershop/v1';
const KINDS = {
  static:    { label: '靜態貼圖',
               cover: s => `${CDN}/product/${s}/LINEStorePC/main.png`,
               file:  i => `${CDN}/sticker/${i}/iPhone/sticker@2x.png` },
  animation: { label: '動態貼圖',
               cover: s => `${CDN}/product/${s}/iPhone/main_animation@2x.png`,
               file:  i => `${CDN}/sticker/${i}/iPhone/sticker_animation@2x.png` },
  popup:     { label: '全螢幕／特效貼圖',
               cover: s => `${CDN}/product/${s}/android/main_popup.png`,
               file:  i => `${CDN}/sticker/${i}/android/sticker_popup.png` },
};
const still = i => `${CDN}/sticker/${i}/iPhone/sticker@2x.png`;
const sound = i => `${CDN}/sticker/${i}/android/sticker_sound.m4a`;
const $ = id => document.getElementById(id);
let packs = [];

// 從網址或文字中找出貼圖組編號
function parseIds(text) {
  const ids = [];
  for (const line of text.split(/[\s,，]+/)) {
    if (!line) continue;
    const m = line.match(/(?:sticker|product)\/(\d{3,})/i) || line.match(/^(\d{3,})$/);
    if (m && !ids.includes(m[1])) ids.push(m[1]);
  }
  return ids;
}

function kindOf(meta) {
  const t = meta.stickerResourceType || '';
  if (t.includes('POPUP')) return 'popup';
  if (meta.hasAnimation || t.includes('ANIMATION')) return 'animation';
  return 'static';
}

async function loadPack(id) {
  const r = await fetch(`${CDN}/product/${id}/android/productInfo.meta`);
  if (!r.ok) throw new Error(id);
  const meta = await r.json();
  const kind = kindOf(meta);
  return {
    id, kind, meta,
    title: meta.title?.zh_TW || meta.title?.en || `貼圖 ${id}`,
    author: meta.author?.zh_TW || meta.author?.en || '',
    ids: (meta.stickers || []).map(s => s.id),
    sound: !!meta.hasSound,
    text: /TEXT|NAME|CUSTOM/.test(meta.stickerResourceType || ''),
  };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tints = ['--t1', '--t2', '--t3', '--t4', '--t0'];

function render() {
  $('out').innerHTML = packs.map((p, k) => {
    const K = KINDS[p.kind];
    return `<section class="pack" style="--tint:var(${tints[k % 5]})" aria-labelledby="h${k}">
      <div class="pack-head">
        <img src="${K.cover(p.id)}" alt="" onerror="this.src='${KINDS.static.cover(p.id)}';this.onerror=null">
        <div>
          <h2 id="h${k}">${esc(p.title)}</h2>
          <p class="meta"><span class="tag">${K.label}</span>${p.author ? '作者 ' + esc(p.author) + '・' : ''}共 ${p.ids.length} 張${p.sound ? '・有聲音' : ''}</p>
        </div>
        <a href="https://line.me/S/sticker/${p.id}" target="_blank" rel="noopener">LINE 商店 ↗</a>
      </div>
      ${p.text ? '<p class="note">這是訊息／自訂文字貼圖，下載的是底圖，不含使用者自己輸入的文字。</p>' : ''}
      <div class="stickers">${p.ids.map((i, n) => `
        <a href="${K.file(i)}" target="_blank" rel="noopener" aria-label="第 ${n + 1} 張，開新分頁看原圖">
          <img src="${K.file(i)}" alt="" loading="lazy"><span>${String(n + 1).padStart(2, '0')}</span></a>`).join('')}
      </div>
    </section>`;
  }).join('') || '<p class="empty">還沒有貼圖，請先在上方貼上網址。</p>';
  const total = packs.reduce((a, p) => a + p.ids.length, 0);
  $('summary').textContent = `${packs.length} 組、${total} 張貼圖`;
  $('bar').classList.toggle('on', packs.length > 0);
}

function setStatus(msg, err) { $('status').textContent = msg; $('status').classList.toggle('err', !!err); }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const ids = parseIds($('urls').value);
  if (!ids.length) return setStatus('找不到貼圖網址，請確認網址裡有「sticker/數字」。', true);
  $('go').disabled = true;
  setStatus(`讀取中…（${ids.length} 組）`);
  const results = await Promise.allSettled(ids.map(loadPack));
  packs = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  const bad = ids.filter((_, i) => results[i].status === 'rejected');
  render();
  $('go').disabled = false;
  if (bad.length) setStatus(`有 ${bad.length} 組讀不到（編號 ${bad.join('、')}），可能已下架或網址有誤。`, true);
  else setStatus(`已取得 ${packs.length} 組貼圖。`);
  history.replaceState(null, '', '?id=' + ids.join(','));
});

// 檔名不能含 \ / : * ? " < > |
const safe = s => s.replace(/[\\/:*?"<>|]/g, '_').replace(/[. ]+$/, '').trim() || 'sticker';

async function pool(jobs, limit, onDone) {
  let next = 0;
  const worker = async () => { while (next < jobs.length) { const j = jobs[next++]; await j(); onDone(); } };
  await Promise.all(Array.from({ length: limit }, worker));
}

$('zip').addEventListener('click', async () => {
  if (!packs.length) return;
  const zip = new JSZip();
  const withStill = $('withStill').checked;
  const jobs = [];
  let failed = 0;
  const add = (url, path, optional) => jobs.push(async () => {
    try {
      const r = await fetch(url);
      if (!r.ok) throw 0;
      zip.file(path, await r.blob());
    } catch { if (!optional) failed++; }
  });
  const used = new Set();
  for (const p of packs) {
    let dir = safe(p.title);
    if (used.has(dir)) dir += `_${p.id}`;
    used.add(dir);
    const K = KINDS[p.kind];
    add(K.cover(p.id), `${dir}/00_封面.png`, true);
    p.ids.forEach((i, n) => {
      const no = String(n + 1).padStart(2, '0');
      add(K.file(i), `${dir}/${no}.png`);
      if (withStill && p.kind !== 'static') add(still(i), `${dir}/靜態圖/${no}.png`, true);
      if (p.sound) add(sound(i), `${dir}/聲音/${no}.m4a`, true);
    });
  }
  const btn = $('zip'), prog = $('prog');
  btn.disabled = true; prog.hidden = false; prog.max = jobs.length; prog.value = 0;
  let done = 0;
  await pool(jobs, 6, () => { prog.value = ++done; btn.textContent = `下載中 ${done}/${jobs.length}`; });
  btn.textContent = '打包中…';
  const blob = await zip.generateAsync({ type: 'blob' });
  const name = packs.length === 1 ? `${safe(packs[0].title)}.zip` : `LINE貼圖_${packs.length}組.zip`;
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  btn.disabled = false; btn.textContent = '下載 ZIP'; prog.hidden = true;
  setStatus(failed ? `已下載 ${name}，但有 ${failed} 張沒抓到，可以再試一次。` : `已下載 ${name}。`, !!failed);
});

// 網址帶 ?id=編號 時自動載入，方便分享
const q = new URLSearchParams(location.search).get('id');
if (q) { $('urls').value = q.split(',').map(i => `https://line.me/S/sticker/${i}`).join('\n'); $('form').requestSubmit(); }
</script>
</body>
</html>
